http:
  routers:
    frontend-nginx-router:
      rule: "PathPrefix(`/`)"
      service: "frontend-nginx-service"
    frontend-angular-router:
      rule: "PathPrefix(`/app`)"
      service: "frontend-angular-service"
    api-spring-router:
      rule: "PathPrefix(`/api/spring`)"
      service: "api-spring-service"
    api-quarkus-router:
      rule: "PathPrefix(`/api/quarkus`)"
      service: "api-quarkus-service"
    api-flask-router:
      rule: "PathPrefix(`/api/flask`)"
      service: "api-flask-service"
    api-dotnet-router:
      rule: "PathPrefix(`/api/dotnet`)"
      service: "api-dotnet-service"